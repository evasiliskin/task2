<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Image Search</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1677ff" />
    <meta
      name="description"
      content="Typeahead search over millions of openly-licensed images from Openverse, with a Canvas-based polygon editor for annotating results."
    />
    <meta name="robots" content="index, follow" />
    <!--
      https://image-search.example.com/ is a placeholder (RFC 2606 .example
      domain) since this screening project has no fixed production domain yet. Replace every
      occurrence in this file with the real deployed origin before shipping — see README.md,
      "SEO & accessibility" section.
    -->
    <link rel="canonical" href="https://image-search.example.com/" />
    <link rel="preconnect" href="https://api.openverse.org" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <meta property="og:title" content="Image Search" />
    <meta
      property="og:description"
      content="Typeahead search over millions of openly-licensed images from Openverse, with a Canvas-based polygon editor for annotating results."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://image-search.example.com/" />
    <meta property="og:image" content="https://image-search.example.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Image Search" />
    <meta
      name="twitter:description"
      content="Typeahead search over millions of openly-licensed images from Openverse, with a Canvas-based polygon editor for annotating results."
    />
    <meta name="twitter:image" content="https://image-search.example.com/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Image Search",
        "description": "Typeahead search over millions of openly-licensed images from Openverse, with a Canvas-based polygon editor for annotating results.",
        "url": "https://image-search.example.com/",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any (runs in a web browser)"
      }
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
