<div class="search-results-list">
  <cdk-virtual-scroll-viewport
    itemSize="96"
    class="search-results-list__viewport"
    (scrolledIndexChange)="onScrolledIndexChange($event)"
  >
    <div
      *cdkVirtualFor="let result of results(); trackBy: trackById"
      class="search-results-list__item"
    >
      <app-search-result-item [result]="result" (selected)="resultSelected.emit(result)" />
    </div>
  </cdk-virtual-scroll-viewport>
  @if (isLoadingMore()) {
    <div class="search-results-list__loading-more" role="status">Loading more results…</div>
  } @else if (isLoadingMoreError()) {
    <div class="search-results-list__load-more-error" role="alert">
      <span>Couldn't load more results.</span>
      <button type="button" nz-button nzSize="small" (click)="retry.emit()">Retry</button>
    </div>
  }
</div>
