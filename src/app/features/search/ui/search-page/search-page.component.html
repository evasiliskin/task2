<section class="search-page" aria-label="Image search">
  <app-search-input />

  @if (status() === 'loading') {
    <div class="search-page__loading" role="status" aria-live="polite">
      <nz-spin nzSimple />
      <span>Searching…</span>
    </div>
  } @else if (status() === 'error') {
    <app-search-error-state [message]="error() ?? 'Something went wrong.'" (retry)="onRetry()" />
  } @else if (status() === 'success' && results().length === 0) {
    <app-search-empty-state [query]="activeQuery() ?? ''" />
  } @else if (results().length > 0) {
    <app-search-results-list
      [results]="results()"
      [hasMoreResults]="hasMoreResults()"
      [isLoadingMore]="isLoadingMore()"
      [isLoadingMoreError]="isLoadingMoreError()"
      (nextPageRequested)="onNextPageRequested()"
      (retry)="onRetry()"
      (resultSelected)="onResultSelected($event)"
    />
  }
</section>
